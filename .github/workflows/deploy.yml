name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Минимально необходимые права для публикации в GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно выполняется только один деплой
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # site и base определяются автоматически из GITHUB_REPOSITORY (см. astro.config.mjs)
      - name: Build
        run: npm run build

      - name: Check links
        run: node scripts/check-site.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
